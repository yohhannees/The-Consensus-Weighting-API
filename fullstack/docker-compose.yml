services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
      POSTGRES_DB: consensus_weighting
    ports:
      # Host port 5433 (not 5432) to avoid colliding with any native Postgres
      # install already listening on the default port.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies prisma/migrations before the app starts. Without this, a
  # fresh volume would boot the app against a database with no tables and every
  # request would 500 until someone ran the migrations by hand. Uses the build
  # stage (which still has the full node_modules with the prisma CLI) rather
  # than the lean runtime image.
  migrate:
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://consensus:consensus@postgres:5432/consensus_weighting"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Uses the in-network service name/port, not the host-mapped 5433.
      DATABASE_URL: "postgresql://consensus:consensus@postgres:5432/consensus_weighting"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres-data:
